[package]
name = "anyq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
integration-test-hooks = ["dep:anyq-integration-test-hooks", "anyq-queue-impl/integration-test-hooks", "anyq-config-impl/integration-test-hooks"]

[dependencies]
anyq-queue-api = { path = "../../features/queue/api" }
anyq-queue-impl = { path = "../../features/queue/impl/composition" }
anyq-config-api = { path = "../../features/config/api" }
anyq-config-impl = { path = "../../features/config/impl/composition" }
anyq-integration-test-hooks = { path = "../../tooling/integration-test-hooks", optional = true }
ctrlc = "=3.5.2"
clap = { version = "4.6", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.38", features = ["bundled"] }

[lints]
workspace = true

[[test]]
name = "interruptions"
path = "tests/interruptions.rs"
required-features = ["integration-test-hooks"]
