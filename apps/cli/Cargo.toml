[package]
name = "anyq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
integration-test-hooks = ["dep:anyq-integration-test-hooks", "anyq-daemon-impl/integration-test-hooks", "anyq-config-impl/integration-test-hooks"]

[dependencies]
anyq-queue-api = { path = "../../features/queue/api" }
anyq-queue-metadata = { path = "../../features/queue/impl/metadata", features = ["files"] }
anyq-daemon-impl = { path = "../../features/daemon/impl/composition" }
anyq-config-api = { path = "../../features/config/api" }
anyq-config-impl = { path = "../../features/config/impl/composition" }
anyq-integration-test-hooks = { path = "../../tooling/integration-test-hooks", optional = true }
ctrlc = "=3.5.2"
clap = { version = "4.6", features = ["derive", "env"] }

[dev-dependencies]
anyq-daemon-api = { path = "../../features/daemon/api" }
anyq-daemon-transport = { path = "../../features/daemon/impl/transport" }
serde_json = "1"
tempfile = "3"
rusqlite = { version = "0.39", features = ["bundled"] }

[lints]
workspace = true

[[test]]
name = "interruptions"
path = "tests/interruptions.rs"
required-features = ["integration-test-hooks"]
