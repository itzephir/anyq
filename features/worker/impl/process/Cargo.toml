[package]
name = "anyq-worker-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyq-worker-api = { path = "../../api" }
anyq-worker-execution = { path = "../execution" }
anyq-queue-api = { path = "../../../queue/api" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[lints]
workspace = true
