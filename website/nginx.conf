server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location = /healthz { default_type text/plain; return 200 'anyq\n'; }
    location ~ ^/install\.(sh|ps1)$ {
        default_type text/plain;
        expires -1;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
