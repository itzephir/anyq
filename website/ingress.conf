map $host $anyq_stand {
    default "";
    dev.anyq.itzephir.com dev;
    anyq.dev.itzephir.com dev;
    anyq.itzephir.com prod;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        if ($anyq_stand = "") { return 404; }
        proxy_pass http://anyq-site-$anyq_stand:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header X-Anyq-Stand $anyq_stand always;
    }
}
