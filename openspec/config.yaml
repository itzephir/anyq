schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  anyq is a Rust local admission queue for named tasks and resource topics.
  A task requires one slot of every attached topic, acquired atomically.
  The global registration sequence orders queued tasks consistently across topics.
  The caller performs external work after task wait returns; anyq never executes commands.
  Running ownership persists until explicit task complete, including after caller failure.
  Callers own external work, its outcome and any decision to run it again.
  Wait without topic membership and ordinary completion before admission are errors.
  Forced completion may remove a registered or queued task without executing work.
  Follow AGENTS.md and docs/ARCHITECTURE.md: domain-owned invariants, api/impl Cargo
  boundaries, consumer-owned ports, explicit DI and narrow typed use-case contracts.
  Keep one standalone type per file and separate logical phases with blank lines.
  SQL executes exact filters; the domain decides admission and state transitions.
  Reject incompatible databases before changing their data or journal mode.
  Runtime requires neither a server nor Python/Node; Node is pinned OpenSpec development tooling.
  Do not mark unverified tasks complete or sync unfinished behavior into baseline specs.
