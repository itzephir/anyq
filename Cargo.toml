[workspace]
resolver = "3"
members = [
  "features/timeout/api",
  "features/timeout/impl/protocol",
  "features/queue/api",
  "features/queue/api/wire",
  "features/queue/impl/dispatch",
  "features/queue/impl/sqlite",
  "features/queue/impl/metadata",
  "features/queue/impl/composition",
  "features/config/api",
  "features/config/impl/dispatch",
  "features/config/impl/file",
  "features/config/impl/composition",
  "features/daemon/api",
  "features/daemon/impl/transport",
  "features/daemon/impl/client",
  "features/daemon/impl/runtime",
  "features/daemon/impl/composition",
  "features/plugins/api",
  "features/plugins/api/wire",
  "features/plugins/impl/dispatch",
  "features/plugins/impl/sqlite",
  "features/plugins/impl/process",
  "features/plugins/impl/runtime",
  "features/plugins/impl/composition",
  "apps/cli",
  "tooling/architecture-lint",
  "tooling/integration-test-hooks"
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
