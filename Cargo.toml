[workspace]
resolver = "3"
members = [
  "features/queue/api",
  "features/queue/impl/dispatch",
  "features/queue/impl/sqlite",
  "features/queue/impl/composition",
  "apps/cli",
  "tooling/architecture-lint"
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
