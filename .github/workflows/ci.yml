name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r tooling/requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: npm ci --ignore-scripts
      - run: npm run spec:check
      - run: python tooling/check_architecture.py
      - run: cargo run --locked -p anyq-architecture-lint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  build-and-unit-tests:
    name: Build & unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --lib --bins --exclude anyq-queue-sqlite --exclude anyq-config-file --locked
  integration-tests:
    name: Integration tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SQLite integration tests
        run: cargo test --locked -p anyq-queue-sqlite --lib
      - name: Configuration file integration tests
        run: cargo test --locked -p anyq-config-file --lib
      - run: cargo test --locked -p anyq --test workflow --features integration-test-hooks
      - name: Native Ctrl+C integration tests
        run: cargo test --locked -p anyq --test interruptions --features integration-test-hooks
      - run: cargo build --locked -p anyq
      - run: python examples/demo.py
      - run: python examples/metadata.py
      - run: python examples/plugins.py
  distribution:
    uses: ./.github/workflows/distribution.yml
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python tooling/build_website.py
      - run: node --test tooling/website.test.cjs
      - run: python -m unittest discover -s tooling -p 'receiver_website_test.py'
      - run: docker build -f website/Dockerfile -t anyq-site:test .
      - run: bash tooling/test_website_container.sh
      - run: python tooling/hosting_website_test.py
      - run: python tooling/package_website.py
      - uses: actions/upload-artifact@v4
        with:
          name: anyq-website
          path: website/site.zip
          if-no-files-found: error
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [lint, build-and-unit-tests, integration-tests, distribution, website]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every category to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs['build-and-unit-tests'].result }}
          INTEGRATION_RESULT: ${{ needs['integration-tests'].result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$DISTRIBUTION_RESULT" = success
          test "$WEBSITE_RESULT" = success
  deploy-dev:
    needs: ci-passed
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    uses: ./.github/workflows/website.yml
    with:
      stand: dev
    secrets: inherit
  deploy-prod:
    needs: ci-passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/website.yml
    with:
      stand: prod
    secrets: inherit
