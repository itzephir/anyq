name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a main commit and matching Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python -c 'import os,tomllib; version=tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"]; assert os.environ["RELEASE_TAG"] == "v"+version'
  distribution:
    needs: verify-version
    uses: ./.github/workflows/distribution.yml
  publish:
    needs: distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: anyq-release
          path: release-dist
      - name: Upload all assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" release-dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
