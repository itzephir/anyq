name: Desktop packages
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: macos-15
            bundle: app
          - os: macos-15-intel
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf
      - name: Controller integration tests
        run: cargo test --locked -p anyq-desktop --features native --bin anyq-panel
      - name: Package optional desktop client
        working-directory: apps/desktop
        run: npx tauri build --features native --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: anyq-desktop-${{ matrix.os }}
          path: target/release/bundle/
          if-no-files-found: error
  ui:
    name: Native UI & screenshots (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-ui-${{ matrix.os }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tooling/requirements-desktop.txt
      - name: Linux graphical session
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf xvfb dbus-x11 openbox
      - name: Build real client and native test application
        run: cargo build --locked -p anyq -p anyq-desktop --features anyq-desktop/integration-test-hooks,anyq-desktop/custom-protocol
      - name: Native Linux integration and screenshot scenarios
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' sh -c 'openbox >/tmp/anyq-openbox.log 2>&1 & python tooling/test_desktop.py --cli target/debug/anyq --panel target/debug/anyq-panel'
      - name: Native macOS integration and screenshot scenarios
        if: runner.os == 'macOS'
        run: python tooling/test_desktop.py --cli target/debug/anyq --panel target/debug/anyq-panel
      - name: Native Windows integration and screenshot scenarios
        if: runner.os == 'Windows'
        run: python tooling/test_desktop.py --cli target/debug/anyq.exe --panel target/debug/anyq-panel.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-ui-${{ matrix.os }}
          path: desktop-test-results/
          if-no-files-found: error
