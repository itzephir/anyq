name: Desktop packages
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: macos-15
            bundle: app
          - os: macos-15-intel
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf
      - name: Controller integration tests
        run: cargo test --locked -p anyq-desktop --features native --bin anyq-panel
      - name: Package optional desktop client
        working-directory: apps/desktop
        run: npx tauri build --features native --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: anyq-desktop-${{ matrix.os }}
          path: target/release/bundle/
          if-no-files-found: error
