name: Desktop packages
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: macos-15
            bundle: app
          - os: macos-15-intel
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r tooling/requirements-desktop.txt
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev patchelf xvfb dbus-x11 openbox xdotool python3-gi gir1.2-atspi-2.0
      - name: Controller integration tests
        run: cargo test --locked -p anyq-desktop --features native --bin anyq-panel
      - name: Package optional desktop client
        working-directory: apps/desktop
        run: npx tauri build --features native --bundles ${{ matrix.bundle }} -- --locked
      - name: Build independent production CLI
        run: cargo build --locked -p anyq
      - name: Install, launch, remove and reinstall Linux package
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -dpi 96' sh -c 'openbox >/tmp/anyq-package-openbox.log 2>&1 & python tooling/test_desktop_package.py --cli target/debug/anyq'
      - name: Install, launch, remove and reinstall macOS package
        if: runner.os == 'macOS'
        run: python tooling/test_desktop_package.py --cli target/debug/anyq
      - name: Install, launch, remove and reinstall Windows package
        if: runner.os == 'Windows'
        run: python tooling/test_desktop_package.py --cli target/debug/anyq.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-package-evidence-${{ matrix.os }}
          path: desktop-package-results/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: anyq-desktop-${{ matrix.os }}
          path: target/release/bundle/
          if-no-files-found: error
  ui:
    uses: ./.github/workflows/desktop-ui.yml
    with:
      mode: verify
