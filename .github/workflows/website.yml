name: Publish website image
on:
  push:
    branches: [main]
    paths: ['website/**', 'install/**', 'tooling/build_website.py', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: website/Dockerfile
          push: true
          tags: ghcr.io/itzephir/anyq-site:${{ github.sha }},ghcr.io/itzephir/anyq-site:latest
