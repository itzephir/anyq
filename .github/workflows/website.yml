name: Deploy website
on:
  workflow_call:
    inputs:
      stand:
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    name: Deploy ${{ inputs.stand }} website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ inputs.stand == 'prod' && 'production' || 'development' }}
      url: ${{ inputs.stand == 'prod' && 'https://anyq.itzephir.com/' || 'https://dev.anyq.itzephir.com/' }}
    concurrency:
      group: anyq-website-${{ inputs.stand }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: anyq-website
          path: website-artifact
      - name: Publish the tested public website through a stand-scoped key
        env:
          STAND: ${{ inputs.stand }}
          DEPLOY_HOST: ${{ secrets.ANYQ_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.ANYQ_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ANYQ_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$STAND" == dev || "$STAND" == prod ]]
          [[ "$STAND" != prod || "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ -n "$DEPLOY_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$work/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$work/known_hosts"
          ssh -T -i "$work/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts" \
            -o ForwardAgent=no -o ConnectTimeout=15 \
            "root@$DEPLOY_HOST" "deploy $GITHUB_SHA" < website-artifact/site.zip
          if [[ "$STAND" == dev ]]; then
            url=https://dev.anyq.itzephir.com
          else
            url=https://anyq.itzephir.com
          fi
          curl -fsS --retry 6 --retry-all-errors --retry-delay 2 "$url/revision.txt" | grep -qx "$GITHUB_SHA"
          curl -fsS "$url/" -o /dev/null
          printf 'Published %s website: %s\n' "$STAND" "$url" >> "$GITHUB_STEP_SUMMARY"
